# Pulse Android JVM args — sized for CI + local sandbox builds.
# 2048m: Wave 1 added Coil; :app:mergeExtDexRelease D8 OOM'd at 1200m on CI.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
ksp.useKSP2=false

kotlin.daemon.jvmargs=-Xmx768m
kotlin.compiler.execution.strategy=in-process
