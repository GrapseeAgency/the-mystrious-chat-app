# Pulse iOS — XcodeGen project spec.
# Generate the .xcodeproj with `xcodegen` (CI does this automatically):
#   cd apps/ios && xcodegen generate
name: Pulse
options:
  bundleIdPrefix: app.pulse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.3"
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.0.1"
  # Wave 3 — WebRTC binary framework (stasel distribution, prebuilt
  # xcframework per tag). Pinned up-to-next-major from the real stable tag
  # 125.0.0 (verified via git ls-remote --tags; tags run 88.0.0 → 152.0.0).
  # The product name is "WebRTC" (import WebRTC).
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "125.0.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: true
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - Pulse
    dependencies:
      - package: GRDB
      - package: SocketIO
      - package: WebRTC
    infoProperties:
      CFBundleDisplayName: Pulse
      # Wave 3 — the native version string now mirrors the release tag
      # convention (v0.4.0-native was tag-only; Android carries versionName).
      CFBundleShortVersionString: 0.10.0-native
      UILaunchScreen: {}
      # R8 push/callkit readiness — UIBackgroundModes lets the signed app
      # receive remote-notification + voip pushes (PushKit/CallKit path);
      # delivery still arms only when the Apple credentials exist.
      UIBackgroundModes: [remote-notification, voip]
      UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
      NSMicrophoneUsageDescription: Pulse uses the microphone for voice notes, voice rooms and calls.
      # Wave R1-W2D — video calls capture the camera through WebRTC; the
      # description covers every camera surface (photos, video notes, calls).
      NSCameraUsageDescription: Pulse uses the camera for photos, video notes and video calls.
      # R1-W2B F-MD-07 — one-shot when-in-use fix for the location pin share.
      NSLocationWhenInUseUsageDescription: Pulse uses your location once to share a map pin in a chat.
      # Wave 0 — outbox background refresh (matches PulseApp.outboxTaskID).
      BGTaskSchedulerPermittedIdentifiers: ["app.pulse.chat.outbox"]
      # Wave 6 — pulse:// deep links (invite / user / room / R10-b new), F-DL.
      CFBundleURLTypes:
        - CFBundleURLName: app.pulse.chat
          CFBundleURLSchemes: ["pulse"]
      # R10-b — home-screen quick actions (static UIApplicationShortcutItems).
      # The type strings MUST stay byte-identical with the
      # PulseQuickActionRoute.openType/.composeType constants (PulseQuickActions.swift);
      # delivery: PulseAppDelegate configurationForConnecting → PulseSceneDelegate
      # → PulseQuickActions.pendingRoute → RootView consumption.
      UIApplicationShortcutItems:
        - UIApplicationShortcutItemType: app.pulse.shortcut.open
          UIApplicationShortcutItemTitle: Open Pulse
          UIApplicationShortcutItemSubtitle: Chats
          UIApplicationShortcutItemIconSymbolName: bubble.left.and.bubble.right
        - UIApplicationShortcutItemType: app.pulse.shortcut.compose
          UIApplicationShortcutItemTitle: New message
          UIApplicationShortcutItemIconSymbolName: square.and.pencil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pulse.chat
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_NAME: AppIcon
  PulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulseTests
        # The socket fixture runs from the SOURCE tree (Process + #filePath
        # lookup) — node_modules must never leak into the generated project.
        excludes:
          - "Fixtures/node_modules"
    dependencies:
      - target: Pulse
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseTests: [test]
    test:
      targets: [PulseTests]
      # SocketRoundTripTests connects to the node relay that CI starts as a
      # runner-side step on 127.0.0.1:3995 (the simulator shares host loopback;
      # the iOS SDK has no Process, so the test cannot spawn it itself).
      environmentVariables:
        - variable: PULSE_RELAY_URL
          value: http://127.0.0.1:3995
          isEnabled: true
