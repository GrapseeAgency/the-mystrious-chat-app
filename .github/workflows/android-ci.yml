name: Pulse Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/android/**', 'packages/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: JVM tests (pure Kotlin — domain + live-protocol + socket round-trip)
        run: ./gradlew :domain:test :protocol:test :core:build

      - name: Assemble signed release APK (committed LiveUpdate keystore)
        run: ./gradlew :app:assembleRelease

      - name: Rename APK with release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Pulse-${{ github.ref_name }}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/app/build/outputs/apk/release/Pulse-*.apk

  # Wave 0 quality gate: the app must actually LAUNCH and the Room v3→v4
  # migration must be proven non-destructive on a real Android system image.
  instrumented:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK + instrumented test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :data:assembleDebugAndroidTest

      - name: Run instrumented tests on emulator (launch smoke + Room migration + outbox/draft DAOs)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd apps/android && ./gradlew :app:connectedDebugAndroidTest :data:connectedDebugAndroidTest

      - name: Upload instrumented test reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-instrumented-reports
          path: apps/android/**/build/outputs/androidTest-results/**
          if-no-files-found: ignore
