name: Pulse Android CI

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed APK to GitHub Releases after native checks pass
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/android/**', 'packages/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['apps/android/**', 'packages/**', '.github/workflows/android-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    # Tag builds publish the Release themselves (softprops/action-gh-release)
    # — the default GITHUB_TOKEN is read-scoped without this grant.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: JVM tests (pure Kotlin — domain + live-protocol + socket round-trip + W4 stories + W5 voice rooms)
        run: |
          set -o pipefail
          ./gradlew :domain:test :protocol:test :core:build :data:testDebugUnitTest :feature-stories:testDebugUnitTest :feature-voice:testDebugUnitTest :app:testDebugUnitTest :feature-chat:testDebugUnitTest :feature-calls:testDebugUnitTest :feature-hub:testDebugUnitTest :feature-settings:testDebugUnitTest 2>&1 | tee /tmp/pulse-native-jvm.log

      - name: Native test failure diagnostics
        if: failure()
        run: python3 ../../scripts/ci/native-test-diagnostics.py

      - name: Assemble signed release APK (committed LiveUpdate keystore)
        # R12 — the repo gradle.properties caps the daemon at 1536m, but this
        # app's R8 + dex-desugar pass needs >3.4GB (measured in-sandbox);
        # under-capped it GC-thrashes forever instead of failing (the 3h
        # assemble "hang" on the first tag build). Real headroom on the
        # 7GB runner, single-objective daemon selection via -D.
        run: ./gradlew :app:assembleRelease -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Dorg.gradle.workers.max=2

      - name: Rename APK with release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Pulse-${{ github.ref_name }}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk

  # The Release itself is published ONLY after the instrumented job has
  # booted this exact signed APK on the emulator (release smoke). A green
  # compile alone never shipped again.
  publish:
    runs-on: ubuntu-latest
    needs: [build, instrumented]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download smoke-tested APK
        uses: actions/download-artifact@v4
        with:
          name: pulse-release-apk
          path: apk

      - name: Publish GitHub Release (tag build)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/Pulse-*.apk

      - name: Publish directly installable APK (explicit manual release)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PYVERSION'
          import re
          from pathlib import Path
          source = Path('apps/android/app/build.gradle.kts').read_text()
          print(re.search(r'val pulseVersionName[^\n]+\?: "([0-9.]+)"', source).group(1))
          PYVERSION
          )
          TAG="v$VERSION"
          APK="Pulse-$TAG.apk"
          test -s apk/app-release.apk
          cp apk/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat > release-notes.md <<EOF
          Signed Android APK built from commit $GITHUB_SHA.

          Download **$APK** below and open it on your Android phone. No ZIP extraction is required.

          Includes the merged native read/unread ordering repairs and call-permission ownership fixes. Android version code: 54. Autumn styling is preserved.

          Native automated checks completed before publication. Physical-device acceptance remains outstanding. This release does not deploy the backend or apply database migrations; a compatible configured backend is required for online chat.
          EOF
          # Never silently replace a different build under an existing release tag.
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --target "$GITHUB_SHA" --title "Pulse $VERSION" --notes-file release-notes.md --latest

  # Wave 0 quality gate: the app must actually LAUNCH and the Room v3→v4
  # migration must be proven non-destructive on a real Android system image.
  # The release smoke runs on BOTH API 30 and API 34 (Android 14 hardens
  # FGS types, PendingIntent mutability, receiver exports) at phone-realistic
  # metrics (1080x2340 @ 440dpi) so the artifact is judged like a real device.
  instrumented:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    name: instrumented (api ${{ matrix.api-level }})
    defaults:
      run:
        working-directory: apps/android
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK + instrumented test APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :data:assembleDebugAndroidTest 2>&1 | tee /tmp/pulse-native-build.log

      - name: Run instrumented tests on emulator (launch smoke + Room migration + outbox/draft DAOs)
        id: instrumented_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash -o pipefail -c 'cd apps/android && ./gradlew :app:connectedDebugAndroidTest :data:connectedDebugAndroidTest 2>&1 | tee /tmp/pulse-native-instrumented.log'

      - name: Instrumented failure details
        if: failure()
        env:
          PULSE_INSTRUMENTED_OUTCOME: ${{ steps.instrumented_tests.outcome }}
        run: python3 ../../scripts/ci/native-test-diagnostics.py

      - name: RELEASE smoke - boot the signed artifact, walk onboarding, drive all nav paths
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd apps/android && ./gradlew :app:assembleRelease -PpulseQuietAnims=true -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Dorg.gradle.workers.max=2 && adb install -r app/build/outputs/apk/release/app-release.apk && adb shell wm size 1080x2340 && adb shell wm density 440 && export PATH="$PATH:$ANDROID_HOME/platform-tools" && python3 ci/release_smoke.py

      - name: Upload instrumented test reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-instrumented-reports-${{ matrix.api-level }}
          path: apps/android/**/build/outputs/androidTest-results/**
          if-no-files-found: ignore

      - name: Upload release smoke evidence (logcat + screenshots, always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-smoke-${{ matrix.api-level }}
          path: |
            apps/android/release-smoke/**
          if-no-files-found: ignore
