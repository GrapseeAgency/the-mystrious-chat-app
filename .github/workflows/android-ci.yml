name: Pulse Android CI

on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'packages/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: JVM tests (pure Kotlin — domain + live-protocol)
        run: ./gradlew :domain:test :protocol:test :core:build

      - name: Assemble signed release APK (committed LiveUpdate keystore)
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/app/build/outputs/apk/release/*.apk
