name: Pulse Android CI

on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'packages/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['apps/android/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: JVM domain tests (pure Kotlin)
        run: ./gradlew :domain:test :core:build

      - name: Assemble debug APK (full Android graph)
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
