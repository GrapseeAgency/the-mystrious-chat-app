name: Pulse Native Call E2E

# R58 - TRUE two-device call proof on CI (section 7 items 3 + 11/13, emulator
# half): ONE emulator runs TWO Pulse app identities (release flavor
# app.pulse.chat.native as the caller "Alpha", debug flavor
# app.pulse.chat.debug as the callee "Beta") against a REAL web backend
# (next dev on :3000) and the REAL socket relay (:3003), reached over
# 10.0.2.2. The driver walks onboarding on both apps, places a 1:1 call from
# Contacts, answers on Beta, asserts CONNECTED on both, kills Beta mid-call
# (item 3: honest peer-gone + clean rejoin), redials, and fires a REAL
# `adb emu gsm call` interruption mid-call (item 11's Android audio-focus
# half). Every stage leaves screenshots + logcat in the artifact.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: native-call-e2e
  cancel-in-progress: false

jobs:
  call-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The web backend + the relay the two apps will talk to.
      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client + push schema
        env:
          DATABASE_URL: file:${{ github.workspace }}/db/custom.db
        run: |
          bun run db:generate
          bun run db:push

      # The apps adopt the relay separately via the deployment manifest hook:
      # ManifestEndpoints probes {gateway}/update-manifest.json and retargets
      # the socket base. CI-only file - not committed.
      - name: Publish the CI endpoint manifest
        run: |
          cat > public/update-manifest.json << 'EOF'
          { "gateway": "http://10.0.2.2:3000", "socket": "http://10.0.2.2:3003" }
          EOF
          cat public/update-manifest.json

      - name: Start the web backend (next dev on :3000)
        env:
          DATABASE_URL: file:${{ github.workspace }}/db/custom.db
          CRON_SECRET: e2e-secret
        run: |
          nohup bunx next dev -p 3000 > /tmp/next-dev.log 2>&1 &
          for i in $(seq 1 60); do
            # GET /api/users is the app's own connect probe (probeBase) - a
            # 200 with a users array is the honest backend-up signal.
            # (POST /api/users/login is reclaim-only and 404s fresh names.)
            body=$(curl -s http://127.0.0.1:3000/api/users || true)
            if echo "$body" | grep -q '"users"'; then echo "web backend up (users probe)"; exit 0; fi
            sleep 2
          done
          echo "web backend never became healthy"; tail -60 /tmp/next-dev.log; exit 1

      - name: Start the socket relay (:3003)
        env:
          PULSE_SOCKET_PORT: '3003'
          PULSE_ORIGIN: 'http://127.0.0.1:3000'
          CRON_SECRET: e2e-secret
        run: |
          cd mini-services/pulse-socket
          if [ ! -d node_modules ]; then npm install --no-audit --no-fund; fi
          nohup node --experimental-transform-types index.ts > /tmp/relay.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q "listening on port 3003" /tmp/relay.log; then
              echo "relay up"; grep "listening on port" /tmp/relay.log; exit 0
            fi
            sleep 1
          done
          echo "relay never listened"; tail -40 /tmp/relay.log; exit 1

      # The CI edge reproduces the production topology (the repo Caddyfile):
      # one origin for the apps - REST to next:3000, /socket.io and
      # /socket.io?XTransformPort=3003 to the relay. The app's same-origin
      # socket mode rides the XTransformPort rule, exactly like production.
      - name: Start the CI edge (caddy on :3080)
        run: |
          curl -sL -o /tmp/caddy.tar.gz "https://github.com/caddyserver/caddy/releases/download/v2.10.0/caddy_2.10.0_linux_amd64.tar.gz"
          tar -xzf /tmp/caddy.tar.gz -C /tmp caddy
          cat > /tmp/Caddyfile.ci << 'EOF'
          :3080 {
            @transform_port_query {
              query XTransformPort=*
            }
            handle @transform_port_query {
              reverse_proxy localhost:{query.XTransformPort}
            }
            @socketio path /socket.io/*
            handle @socketio {
              reverse_proxy localhost:3003
            }
            handle {
              reverse_proxy localhost:3000
            }
          }
          EOF
          nohup /tmp/caddy run --config /tmp/Caddyfile.ci > /tmp/caddy.log 2>&1 &
          for i in $(seq 1 20); do
            body=$(curl -s http://127.0.0.1:3080/api/users || true)
            if echo "$body" | grep -q '"users"'; then
              sock=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3080/socket.io/?EIO=4&transport=polling" || true)
              echo "edge up (rest 200, socket.io probe $sock)"; exit 0
            fi
            sleep 1
          done
          echo "edge never became healthy"; tail -30 /tmp/caddy.log; exit 1

      - name: Run the two-app call E2E on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # -dns-server 127.0.0.2 is a black hole: the repo-CDN manifest probe
          # (raw.githubusercontent) can never resolve, so a fresh install
          # cannot auto-adopt the PRODUCTION gateway or auto-open the demo
          # account - onboarding stays under the driver's control. Every
          # endpoint the E2E touches is a raw IP (10.0.2.2), so nothing else
          # needs DNS.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server 127.0.0.2
          disable-animations: true
          # The emulator-runner executes each script LINE in its own sh -c, so
          # everything chains on one line with && (same pattern as the
          # release-smoke step in android-ci.yml).
          script: cd apps/android && ./gradlew :app:assembleDebug :app:assembleRelease -PpulseAppId=app.pulse.chat.native -PpulseAppLabel="Pulse Alpha" -PpulseQuietAnims=true -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Dorg.gradle.workers.max=2 && adb install -r app/build/outputs/apk/debug/app-debug.apk && adb install -r app/build/outputs/apk/release/app-release.apk && adb shell wm size 1080x2340 && adb shell wm density 440 && adb root && sleep 2 && adb shell iptables -I OUTPUT -p tcp --dport 443 -j REJECT && adb shell iptables -I OUTPUT -p udp --dport 443 -j REJECT && adb shell iptables -L OUTPUT -n | head -4 && adb shell pm disable-user --user 0 com.google.android.dialer || true; adb shell pm disable-user --user 0 com.android.dialer || true; adb shell media volume --stream 2 --set 0 || true; adb shell pm list packages | grep pulse && python3 ci/call_e2e.py

      - name: Upload call E2E evidence (screenshots, logs, report, relay + web logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-call-e2e-evidence
          path: |
            apps/android/call-e2e/**
            /tmp/relay.log
            /tmp/next-dev.log
            /tmp/caddy.log
          if-no-files-found: ignore
