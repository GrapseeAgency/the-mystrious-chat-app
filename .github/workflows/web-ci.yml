name: Pulse Web CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'package.json', 'bun.lock*', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['src/**', '.github/workflows/web-ci.yml']

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
