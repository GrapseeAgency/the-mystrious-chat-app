name: Pulse Android Native Audit

# R59 - builds the NATIVE MIRROR audit APK: the same source, same versionCode
# and versionName as the shipping release, but a SEPARATE applicationId
# (app.pulse.chat.native) and launcher label ("Pulse Native") so it installs
# SIDE BY SIDE with the store build. The signed artifact is attached to the
# existing release as an extra asset - the release's own assets stay as-is.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  native-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version name (same as the shipping release)
        id: ver
        working-directory: apps/android/app
        run: |
          NAME=$(grep -oP 'pulseVersionName.*\?\s*:\s*"\K[0-9.]+' build.gradle.kts | head -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Assemble signed native-audit APK
        working-directory: apps/android
        run: |
          ./gradlew :app:assembleRelease \
            -PpulseAppId=app.pulse.chat.native \
            -PpulseAppLabel="Pulse Native" \
            -PpulseQuietAnims=true \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" \
            -Dorg.gradle.workers.max=2

      - name: Verify package identity
        working-directory: apps/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -p "$APK" AndroidManifest.xml | strings | grep -q "app.pulse.chat.native" || true
          echo "APK bytes: $(wc -c < "$APK")"

      - name: Rename artifact
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk \
            "Pulse-native-audit-${{ steps.ver.outputs.name }}.apk"

      - name: Attach to the existing release (extra asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.ver.outputs.name }}" \
            "Pulse-native-audit-${{ steps.ver.outputs.name }}.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-native-audit-apk
          path: Pulse-native-audit-*.apk
