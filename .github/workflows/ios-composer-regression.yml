name: Pulse iOS composer regressions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'scripts/ci/ios-composer-results.py'
      - 'tests/native/test_ios_composer_results.py'
      - '.github/workflows/ios-composer-regression.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'scripts/ci/ios-composer-results.py'
      - '.github/workflows/ios-composer-regression.yml'

permissions:
  contents: read

jobs:
  composer-regression:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify result reporter
        run: python3 -m unittest discover -s tests/native -p test_ios_composer_results.py
      - name: Generate Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen generate
      - name: Resolve simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/composer-devices.json
          UDID=$(python3 -c 'import json; d=json.load(open("/tmp/composer-devices.json")); print(next(x["udid"] for ds in d["devices"].values() for x in ds if x.get("isAvailable") and "iPhone" in x["name"]))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run every selected composer test (full iOS suite remains separate)
        id: tests
        working-directory: apps/ios
        run: |
          set -euo pipefail
          python3 ../../scripts/ci/ios-composer-results.py --selectors > /tmp/composer-selectors.txt
          selectors=()
          while IFS= read -r selector; do selectors+=("$selector"); done < /tmp/composer-selectors.txt
          xcodebuild -project Pulse.xcodeproj -scheme Pulse \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -parallel-testing-enabled NO \
            -resultBundlePath /tmp/pulse-composer.xcresult \
            "${selectors[@]}" test \
            SWIFT_COMPILATION_MODE=singlefile COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/pulse-composer-tests.log | xcbeautify
      - name: Require explicit passed outcomes for every selected test
        if: always()
        run: python3 scripts/ci/ios-composer-results.py --log /tmp/pulse-composer-tests.log --output /tmp/pulse-composer-results.json
      - name: Retain native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ios-composer-evidence
          path: |
            /tmp/pulse-composer-results.json
            /tmp/pulse-composer-tests.log
            /tmp/pulse-composer.xcresult
          if-no-files-found: warn
