name: Native server contracts
on:
  workflow_dispatch: {}
  pull_request:
    paths: ['src/lib/message-operation.ts', 'src/app/api/conversations/**', 'prisma/**', 'tests/server/**', '.github/workflows/native-server-contracts.yml']
  push:
    branches: [main]
    paths: ['src/lib/message-operation.ts', 'src/app/api/conversations/**', 'prisma/**', 'tests/server/**', '.github/workflows/native-server-contracts.yml']
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: SQLite transaction and replay contracts
        run: node --experimental-transform-types --test tests/server/*.test.mjs
