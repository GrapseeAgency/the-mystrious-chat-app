name: Native server contracts
on:
  workflow_dispatch: {}
  pull_request:
    paths: ['mini-services/pulse-socket/**', 'src/lib/group-call-ringing.ts', 'src/lib/conversation-pin.ts', 'src/lib/search-visibility.ts', 'src/lib/pin-operation.ts', 'src/lib/message-operation.ts', 'src/lib/message-sync.ts', 'src/lib/message-visibility.ts', 'src/lib/scheduled-delivery.ts', 'src/lib/read-receipt.ts', 'src/lib/direct-conversation.ts', 'src/lib/whiteboard-operation.ts', 'src/lib/reminder-contract.ts', 'src/lib/game-contract.ts', 'src/app/api/games/**', 'src/app/api/tournaments/**', 'src/lib/redpacket-contract.ts', 'src/app/api/redpackets/**', 'src/lib/wallet-contract.ts', 'src/lib/wallet-authorization.ts', 'src/app/api/hub/**', 'src/app/api/reminders/**', 'src/app/api/conversations/**', 'src/app/api/messages/**', 'src/app/api/search/**', 'src/app/api/users/**/saved/**', 'prisma/**', 'tests/server/**', '.github/workflows/native-server-contracts.yml']
  push:
    branches: [main]
    paths: ['mini-services/pulse-socket/**', 'src/lib/group-call-ringing.ts', 'src/lib/conversation-pin.ts', 'src/lib/search-visibility.ts', 'src/lib/pin-operation.ts', 'src/lib/message-operation.ts', 'src/lib/message-sync.ts', 'src/lib/message-visibility.ts', 'src/lib/scheduled-delivery.ts', 'src/lib/read-receipt.ts', 'src/lib/direct-conversation.ts', 'src/lib/whiteboard-operation.ts', 'src/lib/reminder-contract.ts', 'src/lib/game-contract.ts', 'src/app/api/games/**', 'src/app/api/tournaments/**', 'src/lib/redpacket-contract.ts', 'src/app/api/redpackets/**', 'src/lib/wallet-contract.ts', 'src/lib/wallet-authorization.ts', 'src/app/api/hub/**', 'src/app/api/reminders/**', 'src/app/api/conversations/**', 'src/app/api/messages/**', 'src/app/api/search/**', 'src/app/api/users/**/saved/**', 'prisma/**', 'tests/server/**', '.github/workflows/native-server-contracts.yml']
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Install real relay contract dependencies
        run: npm install --prefix mini-services/pulse-socket --no-save --package-lock=false --ignore-scripts --no-audit --no-fund socket.io-client@4.8.3
      - name: SQLite transaction and replay contracts
        run: |
          set -o pipefail
          node --experimental-transform-types --test tests/server/*.test.mjs 2>&1 | tee /tmp/native-contract-tests.log
      - name: Expose sanitized synthetic-test failure through Checks API
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/native-contract-tests.log')
          if p.exists():
              text = p.read_text()[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Native delivery contract::' + text)
          PY
