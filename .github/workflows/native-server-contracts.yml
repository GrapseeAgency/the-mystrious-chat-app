name: Native server contracts
on:
  workflow_dispatch: {}
  pull_request:
    paths: ['src/lib/message-operation.ts', 'src/lib/message-sync.ts', 'src/lib/whiteboard-operation.ts', 'src/lib/reminder-contract.ts', 'src/lib/wallet-contract.ts', 'src/lib/wallet-authorization.ts', 'src/app/api/hub/**', 'src/app/api/reminders/**', 'src/app/api/conversations/**', 'prisma/**', 'tests/server/**', '.github/workflows/native-server-contracts.yml']
  push:
    branches: [main]
    paths: ['src/lib/message-operation.ts', 'src/lib/message-sync.ts', 'src/lib/whiteboard-operation.ts', 'src/lib/reminder-contract.ts', 'src/lib/wallet-contract.ts', 'src/lib/wallet-authorization.ts', 'src/app/api/hub/**', 'src/app/api/reminders/**', 'src/app/api/conversations/**', 'prisma/**', 'tests/server/**', '.github/workflows/native-server-contracts.yml']
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: SQLite transaction and replay contracts
        run: |
          set -o pipefail
          node --experimental-transform-types --test tests/server/*.test.mjs 2>&1 | tee /tmp/native-contract-tests.log
      - name: Expose sanitized synthetic-test failure through Checks API
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/native-contract-tests.log')
          if p.exists():
              text = p.read_text()[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Native delivery contract::' + text)
          PY
